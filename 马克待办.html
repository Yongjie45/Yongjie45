<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Jasper的待办清单</title>
    <!-- 引入 CSS 样式文件 -->
    <link rel="stylesheet" href="style.css">
    <!-- 用 emoji 做网站图标，一行搞定 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <text y='.9em' font-size='90'>📝</text></svg>">
</head>

<body>

    <div class="app">
        <h1>📝Jasper待办</h1>

        <!-- 输入区：一个输入框 + 一个按钮 + 时间选择 -->
        <div class="input-area">
            <input type="text" id="todo-input" placeholder="添加待办事项...">
            <input type="date" id="todo-time">        <!-- 新增时间选择器 -->
            <button id="add-btn" type="button">添加</button>
        </div>

        <ul id="todo-list"></ul>                <!-- 列表区：待办会动态加到这里 -->
        <div class="filter-group">
            <button id="filter-all" class="active">全部</button>
            <button id="filter-active">未完成</button>
            <button id="filter-completed">已完成</button>
        </div>
        <p id="stats"></p>                      <!-- 统计信息 -->
    </div>

    <!-- 引入 JS 文件，放在 body 最后，保证 HTML 先加载完 -->
    <script src="script.js"></script>
</body>

</html>
